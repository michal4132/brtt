[package]
name = "brtt"
description = "Better RTT (Real-Time Transfer) client"
version = "0.1.5"
edition = "2021"
license = "MIT"
authors = ["Michal Bogdziewicz <michal@bogdziewicz.xyz>"]

[dependencies]
env_logger = "0.11"
log = "0.4"
probe-rs = { version = "0.32.0", default-features = false, features = ["builtin-targets", "object"] }
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["cargo", "derive"] }
crossterm = "0.27.0"
defmt-decoder = "1.1"
defmt-parser = "1.0"

[profile.release]
opt-level = "z"       # Optimize for size
lto = true             # Full link-time optimization
codegen-units = 1      # Single codegen unit for max optimization
panic = "abort"        # Smaller binary, no unwinding
strip = true           # Strip symbols and debug info
