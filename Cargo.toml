[package]
name = "brtt"
description = "Better RTT (Real-Time Transfer) client"
version = "0.1.5"
edition = "2021"
license = "MIT"
authors = ["Michal Bogdziewicz <michal@bogdziewicz.xyz>"]
# Unit tests live in tests/ and are included from src via #[path]; disable
# automatic integration-test discovery so those files are not built twice.
autotests = false

[dependencies]
env_logger = "0.11"
log = "0.4"
probe-rs = { version = "0.32.0", default-features = false, features = ["builtin-targets", "object"] }
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["cargo", "derive"] }
crossterm = "0.27.0"
defmt-decoder = "1.1"
defmt-parser = "1.0"
memchr = "2.7"
unicode-width = "0.2"
vte = "0.15"

[profile.release]
opt-level = 2          # Faster compilation than size-optimized release builds
lto = true             # Preserve link-time optimization
codegen-units = 16     # Allow rustc to compile release code in parallel
panic = "abort"       # Smaller binary, no unwinding
strip = true           # Strip symbols and debug info
